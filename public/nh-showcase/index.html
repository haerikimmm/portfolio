<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>namuh Max · NH 2026 Prototype Showcase</title>
<style>
  :root{--accent:#16b84e;--ink:#111827;--muted:#6b7280;--radius:16px}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;color:var(--ink)}
  .nh{max-width:1600px;margin:0 auto;padding:clamp(8px,2vw,24px)}
  .stage{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 40px -8px rgba(17,24,39,.22);isolation:isolate}
  .layer{position:absolute;inset:0;opacity:0;transition:opacity .55s ease;will-change:opacity,transform}
  .layer.on{opacity:1;z-index:2}
  .layer img{position:absolute;left:0;top:0;width:100%;height:auto;display:block;transform-origin:50% 0;
    transition:transform 0s linear;user-select:none;-webkit-user-drag:none}
  .layer.kb img{animation:kb 1.1s cubic-bezier(.2,.7,.2,1) both}
  @keyframes kb{from{scale:1.018;filter:blur(1.5px)}to{scale:1;filter:blur(0)}}
  .cap{position:absolute;left:clamp(10px,2%,24px);bottom:clamp(10px,2.4%,24px);z-index:5;display:flex;align-items:center;gap:10px;
    padding:8px 14px 8px 10px;border-radius:999px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 4px 18px rgba(0,0,0,.12);font-size:clamp(11px,1.1vw,14px);font-weight:600;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
  .cap .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(22,184,78,.5);animation:pulse 1.8s infinite}
  .cap .en{color:var(--muted);font-weight:500}
  .cap .ct{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500;padding-left:8px;border-left:1px solid #e5e7eb}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,184,78,.5)}70%{box-shadow:0 0 0 8px rgba(22,184,78,0)}100%{box-shadow:0 0 0 0 rgba(22,184,78,0)}}
  .intro{position:absolute;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,rgba(255,255,255,.92) 0%,rgba(255,255,255,.75) 45%,rgba(255,255,255,0) 75%)}
  .intro.show{animation:intro 1.6s cubic-bezier(.2,.7,.2,1) both}
  .intro .t{text-align:center;transform:translateY(8px)}
  .intro .n{font-size:clamp(11px,1.1vw,14px);letter-spacing:.2em;color:var(--accent);font-weight:700}
  .intro .k{font-size:clamp(22px,3.6vw,52px);font-weight:800;letter-spacing:-.02em;margin-top:4px}
  .intro .e{font-size:clamp(12px,1.3vw,18px);color:var(--muted);margin-top:2px}
  @keyframes intro{0%{opacity:0}18%{opacity:1}65%{opacity:1}100%{opacity:0}}
  .intro.show .t{animation:introT 1.6s cubic-bezier(.2,.7,.2,1) both}
  @keyframes introT{0%{transform:translateY(14px)}25%{transform:translateY(0)}100%{transform:translateY(-6px)}}
  .play{position:absolute;right:clamp(10px,2%,24px);bottom:clamp(10px,2.4%,24px);z-index:5;width:36px;height:36px;border:0;border-radius:50%;
    background:rgba(255,255,255,.82);backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(0,0,0,.12);cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .3s}
  .stage:hover .play,.play:focus-visible,.paused .play{opacity:1}
  .play svg{width:14px;height:14px;fill:var(--ink)}
  .bar{display:flex;gap:8px;margin-top:14px}
  .chip{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:var(--muted)}
  .chip .track{height:4px;border-radius:4px;background:#e5e7eb;overflow:hidden}
  .chip .fill{height:100%;width:0;background:var(--accent);border-radius:4px}
  .chip .lbl{display:block;margin-top:7px;font-size:clamp(10px,1vw,13px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
  .chip.active .lbl{color:var(--ink)}
  .chip:hover .lbl{color:var(--ink)}
  .nobar .bar{display:none}
  @media (max-width:560px){.chip .lbl .en{display:none}.cap .en{display:none}.cap{padding:4px 9px 4px 7px;gap:6px;font-size:10px;bottom:8px;left:8px}.cap .dot{width:6px;height:6px}.cap .ct{padding-left:6px}.bar{gap:5px;margin-top:10px}}
  @media (prefers-reduced-motion:reduce){.layer.kb img{animation:none}.intro.show,.intro.show .t{animation-duration:.01s}.layer{transition-duration:.2s}}
</style>
</head>

    <div class="cap" id="cap"><span class="dot"></span><span id="cK"></span><span class="en" id="cE"></span><span class="ct" id="cC"></span></div>
    <button class="play" id="play" aria-label="Pause"><svg viewBox="0 0 16 16" id="pIcon"></svg></button>
  </div>
  <div class="bar" id="bar"></div>
</div>

const q = new URLSearchParams(location.search);
const SPEED = parseFloat(q.get('speed')||'1')||1;
